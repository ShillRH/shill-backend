<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$SHILL — the launchpad that pays you to $SHILL</title>
<meta name="description" content="Launch on Pons with a dedicated X tracker, automated scoring and a community leaderboard. Top shillers get paid from creator fees through X Money.">
<meta name="theme-color" content="#050505">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808; --bg-2:#0d0f0e; --line:#1b1e1c; --line-2:#2a2f2c;
  --text:#f4f5f4; --muted:#8e948f; --faint:#555b57;
  --accent:#3fe39a; --accent-2:#b9f5d5; --accent-ink:#04120b; --up:#3fe39a; --down:#f2a39a;
  --glow:rgba(63,227,154,.16);
  --display:"Geist", "Helvetica Neue", Arial, sans-serif;
  --body:"Geist", "Helvetica Neue", Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f5f1; --bg-2:#ecebe6; --line:#dddcd5; --line-2:#cfcec6;
  --text:#121210; --muted:#5f5e58; --faint:#8f8e87;
  --accent:#10a866; --accent-2:#0c7a4a; --accent-ink:#ffffff; --up:#10a866; --down:#b0392c; --glow:rgba(16,168,102,.12); color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ca strip + nav */
.strip{border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.strip .wrap{display:flex;gap:14px;align-items:center;height:36px;overflow-x:auto;white-space:nowrap}
.strip code{font-family:var(--mono);color:var(--text);font-size:12px}
.strip button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.sample{margin-left:auto;border:1px solid var(--line-2);border-radius:99px;padding:1px 10px;color:var(--muted)}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{font:600 17px/1 var(--display);letter-spacing:.28em;text-decoration:none;display:flex;align-items:center;gap:12px;text-transform:uppercase}
.logo i{display:inline-flex;gap:4px;transform:skewX(-24deg);margin-right:2px}
.logo i::before,.logo i::after{content:"";width:6px;height:22px;background:var(--text);border-radius:1px}
.links{display:flex;gap:22px;font-size:15px}
.links a{text-decoration:none;color:var(--muted)}
.links a[aria-current="page"],.links a:hover{color:var(--text)}
.nav-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:transparent;cursor:pointer;text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.solid:hover{opacity:.9}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.burger{display:none}
@media (max-width:820px){.links{display:none}.links.open{display:flex;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 24px;gap:16px}.burger{display:inline-flex}.nav-right .connect{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;padding:88px 0 96px;align-items:center}
.hero h1{font:700 clamp(44px,5.8vw,80px)/.98 var(--display);letter-spacing:-.04em;margin:0 0 28px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lede + p.lede{margin-top:-16px}
.feedwrap{position:relative}
.feedwrap::before{content:"";position:absolute;inset:-10% -20% 0;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero p.lede{font-size:19px;color:var(--muted);max-width:30em;margin:0 0 32px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.feed{position:relative;height:420px;display:flex;flex-direction:column;gap:12px;overflow:hidden;mask-image:linear-gradient(#000 70%,transparent)}
.post{border:1px solid var(--line);background:var(--bg-2);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start}
.post.enter{animation:drop .6s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 16px var(--display);color:#0a0a0a}
.post .who{font-weight:600}
.post .txt{color:var(--muted);font-size:14px;margin-top:2px}
.post .paid{text-align:right;font-size:13px;color:var(--muted)}
.post .paid b{display:block;font:600 18px var(--display);color:var(--text);letter-spacing:-.02em}
.post.ghost{border-style:dashed;background:transparent}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:56px 0 64px}.feed{height:330px}}

/* sections */
section.blk{padding:72px 0;border-top:1px solid var(--line)}
.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--display);letter-spacing:-.04em;margin:0}
.head p{color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:14px}
.tab[aria-pressed="true"]{background:var(--bg-2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line-2)}
.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:760px}
th{text-align:left;font-weight:500;color:var(--faint);font-size:13px;padding:14px 18px;border-bottom:1px solid var(--line)}
td{padding:14px 18px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--bg-2)}
.tok{display:flex;gap:12px;align-items:center}
.tok .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--display);color:#0a0a0a;flex:none;background-size:cover}
.tok small{display:block;color:var(--muted);font-size:13px}
.pair{font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px}
.up{color:var(--up)}.down{color:var(--down)}
.empty td{color:var(--faint);text-align:center;padding:40px}
.skel{height:12px;border-radius:6px;background:var(--line);width:70%}

.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:18px;padding:24px}
.panel h3{font:700 24px/1.1 var(--display);letter-spacing:-.03em;margin:0}
.panel .sub{color:var(--muted);font-size:14px;margin:4px 0 18px}
ol.list,ul.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.list li:last-child{border-bottom:0}
.list .rank{color:var(--faint);width:26px;display:inline-block}
.list .m{color:var(--muted);font-size:14px}
.foot-link{display:inline-block;margin-top:16px;color:var(--muted);font-size:14px}

.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.feats div{padding:28px;border-right:1px solid var(--line)}
.feats div:last-child{border-right:0}
.feats h4,.steps h4{font:600 20px/1.2 var(--display);letter-spacing:-.02em;margin:0 0 8px}
.feats p,.steps p{color:var(--muted);margin:0;font-size:15px}
@media (max-width:820px){.feats{grid-template-columns:1fr}.feats div{border-right:0;border-bottom:1px solid var(--line)}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;counter-reset:s}
.steps li{list-style:none;position:relative;padding-top:56px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;font:800 44px/1 var(--display);color:var(--faint)}
.steps{padding:0;margin:0}
@media (max-width:820px){.steps{grid-template-columns:1fr}}

.cta-band{padding:110px 0;text-align:center;border-top:1px solid var(--line)}
.cta-band h2{font-size:clamp(40px,6vw,76px);margin-bottom:14px}
.cta-band p{color:var(--muted);margin:0 0 28px}

footer{border-top:1px solid var(--line);padding:56px 0 40px;color:var(--muted);font-size:14px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
footer h5{color:var(--text);font-size:14px;font-weight:600;margin:0 0 12px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a{text-decoration:none}
footer a:hover{color:var(--text)}
footer .legal{margin-top:40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--faint)}
@media (max-width:720px){footer .cols{grid-template-columns:1fr 1fr}}

/* pages */
.page-h{padding:64px 0 32px}
.page-h h1{font:700 clamp(38px,5vw,64px)/1 var(--display);letter-spacing:-.04em;margin:0 0 12px}
.page-h p{color:var(--muted);max-width:36em;margin:0}
.search{height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);padding:0 14px;min-width:260px}

/* forms */
.form{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;padding-bottom:80px;align-items:start}
@media (max-width:900px){.form{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:18px;padding:24px;margin:0 0 20px}
legend{font:600 18px var(--display);padding:0 8px;letter-spacing:-.02em}
.field{display:grid;gap:6px;margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{font-size:14px;font-weight:500}
.field .hint{font-size:13px;color:var(--faint)}
.in{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);padding:0 14px;width:100%}
textarea.in{height:auto;min-height:92px;padding:12px 14px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);font-size:14px;color:var(--muted)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.drop{display:flex;gap:14px;align-items:center}
.drop .pv{width:64px;height:64px;border-radius:16px;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--faint);background-size:cover;background-position:center;flex:none}
.side{position:sticky;top:88px}
.summary .list li span:first-child{color:var(--muted)}
.note{font-size:14px;color:var(--muted);border-left:2px solid var(--line-2);padding-left:12px;margin:16px 0}
.err{color:var(--down);font-size:14px;margin-top:10px}
.ok{color:var(--up);font-size:14px;margin-top:10px}
.addr{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.key{filter:blur(5px);cursor:pointer;transition:filter .2s}
.key.show{filter:none}

/* token page */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:24px}
.stats div{padding:20px 22px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats span{color:var(--muted);font-size:14px;display:block}
.stats b{font:700 26px/1.2 var(--display);letter-spacing:-.03em}
@media (max-width:720px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.tokhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tokhead .ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font:700 30px var(--display);color:#07120c;flex:none}

/* docs */
.docs{display:grid;grid-template-columns:200px 1fr;gap:48px;padding-bottom:80px}
.docs aside{position:sticky;top:88px;align-self:start;display:grid;gap:10px;font-size:15px}
.docs aside a{color:var(--muted);text-decoration:none}
.docs aside a:hover{color:var(--text)}
.docs article{max-width:68ch}
.docs h2{font-size:32px;margin:48px 0 14px}
.docs h2:first-child{margin-top:0}
.docs p,.docs li{color:var(--muted)}
.docs li{margin-bottom:6px}
.docs strong{color:var(--text);font-weight:600}
@media (max-width:820px){.docs{grid-template-columns:1fr}.docs aside{position:static;grid-auto-flow:column;overflow-x:auto}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eng{display:flex;gap:12px;color:var(--faint);font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.post .paid b{font-size:16px;color:var(--accent)}
.why{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.why p{color:var(--muted);font-size:18px;margin:0 0 14px;max-width:32em}
.why .big{font:700 clamp(26px,3vw,36px)/1.15 var(--display);letter-spacing:-.03em;color:var(--text);margin:0}
.why .big span{display:block;color:var(--faint)}
.why .big span:last-child{color:var(--text)}
@media (max-width:820px){.why{grid-template-columns:1fr;gap:28px}}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.flow span{border:1px solid var(--line-2);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--muted)}
.flow span:last-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps.five{grid-template-columns:repeat(5,1fr);gap:28px}
@media (max-width:980px){.steps.five{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.steps.five{grid-template-columns:1fr}}
.lb td{padding:12px 16px}
.lb table{min-width:860px}
/* ===== Tipr-style shell: left sidebar, top search ===== */
body{font-family:var(--body)}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidenav{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px;background:var(--bg);overflow-y:auto}
.sidenav .logo{padding:4px 10px 0}
.navlist{display:grid;gap:2px}
.navlist a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}
.navlist a:hover{color:var(--text);background:var(--bg-2)}
.navlist a[aria-current="page"]{color:var(--text);background:var(--bg-2);box-shadow:inset 2px 0 0 var(--accent)}
.navlist svg,.searchwide svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.walletbtn{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer}
.walletbtn:hover{border-color:var(--accent)}
.walletbtn b{font-weight:600;font-size:15px}
.walletbtn span{color:var(--muted);font-size:13px}
.sidefoot{margin-top:auto;display:grid;gap:8px;padding:0 10px;font-size:13px;color:var(--faint)}
.sidefoot a{color:var(--muted);text-decoration:none}
.sidefoot a:hover{color:var(--text)}
.sidefoot span{margin-top:8px;line-height:1.45}
.maincol{min-width:0;display:flex;flex-direction:column}
.stripin{display:flex;gap:14px;align-items:center;height:36px;padding:0 32px;overflow-x:auto;white-space:nowrap}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:12px 32px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.topbar{top:env(safe-area-inset-top,0px)}
.searchwide{flex:1;min-width:0;max-width:560px;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2);color:var(--faint)}
.searchwide input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--text);font-size:15px}
.searchwide:focus-within{border-color:var(--accent)}
#connectBtn{margin-left:auto}
main#app{flex:1}
.maincol .wrap{max-width:1120px;margin:0;padding:0 32px}
.mfoot{border-top:1px solid var(--line);padding:24px 0;color:var(--faint);font-size:13px}
.mfoot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mfoot a{color:var(--muted);text-decoration:none;margin-left:14px}
.scrim{display:none}
.burger{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .sidenav{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:40;transform:translateX(-100%);transition:transform .25s}
  .sidenav.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}
  .burger{display:inline-flex}
  .topbar,.stripin{padding-left:18px;padding-right:18px}
  .maincol .wrap{padding:0 18px}
  .topbar .btn.solid{display:none}
  .topbar{gap:8px}
  #connectBtn{flex:none;padding:0 10px}
}

/* ===== home (Tipr layout) ===== */
.eyebrow{display:block;font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hx{padding:40px 0 26px}
.hx .brandrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:14px}
.hx .brandrow .pfp{width:22px;height:22px;border-radius:50%;background:var(--text);display:grid;place-items:center}
.hx .brandrow .pfp i{display:inline-flex;gap:2px;transform:skewX(-24deg)}
.hx .brandrow .pfp i::before,.hx .brandrow .pfp i::after{content:"";width:2.5px;height:10px;background:var(--bg)}
.hx h1{font:700 clamp(46px,6.6vw,92px)/.95 var(--display);letter-spacing:-.045em;margin:0 0 22px;max-width:14ch}
.hx h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hx .hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hx .hrow p{margin:0;max-width:40em;color:var(--muted);font-size:16px}
.hx .hrow .ctas{display:flex;gap:10px}
.btn.white{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.dark{background:var(--bg-2);border-color:var(--line-2)}

.marq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;margin:0 0 16px;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.marq .track{display:flex;width:max-content;animation:marq 48s linear infinite}
.marq:hover .track{animation-play-state:paused}
.marq .it{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;font-size:13px;color:var(--muted);white-space:nowrap}
.marq .it b{color:var(--text);font-weight:500}
.marq .it .ring{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.marq .it .ring.g{border-color:var(--accent)}
@keyframes marq{to{transform:translateX(-50%)}}

.pnl{border:1px solid var(--line);border-radius:16px;background:#0c0c0c;overflow:hidden;display:flex;flex-direction:column;min-width:0}
:root[data-theme="light"] .pnl{background:var(--bg-2)}
.pnl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pnl-h h3,.pnl-h h2{margin:4px 0 0;font:600 18px/1.2 var(--display);letter-spacing:-.02em}
.pnl-h h2{font-size:22px}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.iconbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--muted)}
.iconbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.g2{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:1100px){.g2{grid-template-columns:1fr}}

/* carousel */
.car{flex:1;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:28px 26px}
.car .who .h{font-size:14px;color:var(--accent)}
.car .who h4{font:700 clamp(30px,3.6vw,44px)/1 var(--display);letter-spacing:-.035em;margin:8px 0 8px;color:var(--text)}
.car .who p{margin:0 0 20px;color:var(--muted);font-size:15px}
.car .who .kv{display:flex;gap:26px;margin-bottom:22px}
.car .who .kv span{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.car .who .kv b{font:600 18px var(--display)}
.frame{position:relative;width:188px;height:188px;border-radius:16px;padding:6px;background:var(--bg);border:1px solid var(--line-2);box-shadow:0 0 0 1px #000,0 20px 60px var(--glow)}
.frame svg{width:100%;height:100%;border-radius:11px;display:block}
.frame .xb{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;border:3px solid #0c0c0c}
.car-f{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line)}
.segs{display:flex;gap:6px;flex:1;justify-content:center}
.segs button{width:22px;height:3px;border:0;border-radius:2px;background:var(--line-2);padding:0;cursor:pointer;position:relative;overflow:hidden}
.segs button[aria-current="true"]{width:40px}
.segs button[aria-current="true"] i{position:absolute;inset:0;width:0;background:var(--text)}
.segs button.done{background:var(--muted)}
.car-empty{flex:1;display:grid;place-items:center;padding:40px;text-align:center;color:var(--faint)}
@media (max-width:640px){.car{grid-template-columns:1fr}.frame{width:140px;height:140px;order:-1}}

/* orbit map */
.orbit{position:relative;width:100%;max-width:430px;margin:14px auto 6px;aspect-ratio:6/5}
.orbit svg.rings{position:absolute;inset:0;width:100%;height:100%}
.onode{position:absolute;transform:translate(-50%,-50%);width:128px;padding:9px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);font-size:12px;line-height:1.3}
.onode b{display:block;font-size:12.5px;font-weight:600}
.onode span{color:var(--muted);font-size:11px}
.onode .ic2{float:right;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:10px;color:var(--accent)}
.hub2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--bg);border:1px solid var(--accent);display:grid;place-items:center;box-shadow:0 0 30px var(--glow);font-size:10px;color:var(--muted);text-align:center}
.hub2 i{display:inline-flex;gap:3px;transform:skewX(-24deg);margin-bottom:3px}
.hub2 i::before,.hub2 i::after{content:"";width:4px;height:14px;background:var(--text)}
.map-f{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);margin-top:auto}
.map-f b{color:var(--text);font-weight:500}
.map-f .st{display:inline-flex;gap:8px;align-items:center}
.map-f .st i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.map-f .st i.on{background:var(--accent)}
@media (max-width:420px){.onode{width:96px;padding:7px}}

/* stats */
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.st4 .pnl{padding:16px 18px}
.st4 b{display:block;font:600 30px/1.2 var(--display);letter-spacing:-.03em;margin:10px 0 2px}
.st4 small{color:var(--faint);font-size:13px}
@media (max-width:820px){.st4{grid-template-columns:1fr 1fr}}

/* demo */
.dm{display:grid;grid-template-columns:1fr 300px}
.dm .main{padding:22px 22px 24px;min-width:0}
.dm .line{height:2px;background:var(--line-2);border-radius:1px;overflow:hidden;margin-bottom:22px}
.dm .line i{display:block;height:100%;width:0;background:var(--text)}
.dm .no{font-size:12px;color:var(--faint)}

.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px}
.chip{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.chip .ci{width:28px;height:28px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.chip .ok{position:absolute;top:10px;right:10px;font-size:12px;color:var(--faint)}
.chip b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:11px;color:var(--muted)}
.chip.done .ok{color:var(--accent)}
.chip.on{border-color:var(--muted);background:var(--bg-2);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.chip.on .ci{border-color:var(--accent);color:var(--accent)}
.dm .whycol{border-left:1px solid var(--line);padding:22px}
.dm .whycol h3{font-size:22px;margin:6px 0 10px}
.dm .whycol>p{color:var(--muted);font-size:14px;margin:0 0 18px}
.rbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rbox b{display:block;font-size:14px;font-weight:600;margin-top:6px}
.rbox.hi{border-color:var(--line-2);background:var(--bg-2)}
.dash{display:flex;gap:5px;margin-top:12px}
.dash i{flex:1;height:3px;border-radius:2px;background:var(--line-2)}
.dash i.on{background:var(--accent)}
@media (max-width:1000px){.dm{grid-template-columns:1fr}.dm .whycol{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* spotlight */
.sp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.spc{background:#0c0c0c;padding:18px}

.spc .top span{font-size:12px;color:var(--muted)}
.spc .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spc .kv span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.spc .kv b{font-size:15px;font-weight:600}
.sp-empty{padding:40px 18px;text-align:center;color:var(--faint)}
@media (max-width:1000px){.sp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.sp{grid-template-columns:1fr}}

// Tidy up common API_BASE typos: trailing slashes, a leftover "/health", or a missing "https://".
CONFIG.API_BASE=String(CONFIG.API_BASE||"").trim().replace(/\/+$/,"").replace(/\/(health|launch\/config)$/i,"").replace(/\/+$/,"");
if(CONFIG.API_BASE&&!/^https?:\/\//i.test(CONFIG.API_BASE)) CONFIG.API_BASE="https://"+CONFIG.API_BASE;
function apiProblem(status,url){
  let host=""; try{host=new URL(url).host;}catch{}
  if(host&&host===location.host) return `The site is calling itself (${host}) instead of your backend. In your site file, set API_BASE to your Railway backend address (the one ending in .up.railway.app), not ${host}.`;
  if(status===404) return `Your backend at ${host} doesn't have ${new URL(url).pathname}. Make sure the latest backend is deployed on Railway and that API_BASE is your Railway backend address. (404)`;
  if(status>=500) return `Your backend at ${host} had a problem (${status}). Check the API service's Deploy Logs on Railway.`;
  return `Request to ${host} failed (${status}).`;
}
async function apiFetch(path,init){
  const url=CONFIG.API_BASE+path;
  let r;
  try{r=await fetch(url,init);}
  catch{throw new Error(`Couldn't reach your backend at ${CONFIG.API_BASE}. Check that it's running on Railway (open ${CONFIG.API_BASE}/health), and that FRONTEND_ORIGIN on Railway is exactly ${location.origin}.`);}
  return {r,url};
}

    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(r.status===404||!j.error?apiProblem(r.status,url):j.error);}
    return r.json();

  async post(path,body){

/* ---------- wallet (Robinhood Chain) ---------- */
let account=null;
// Wallet connection. Returns the address, or throws an Error with a plain-English reason that the
// caller shows on screen. `onWait` is told when we're waiting on the wallet so the page never looks frozen.
function walletProblem(){
  if(window.ethereum) return null;
  const phone=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  return phone
    ? "No wallet found in this browser. On a phone, open shill.fyi inside your wallet app's browser (in MetaMask: tap the menu, then Browser)."
    : "No wallet found in this browser. Install MetaMask (or another EVM wallet) as a browser extension, then refresh this page.";
}
async function withWalletWait(promise,onWait){
  // If the wallet hasn't answered after 6 seconds, tell the user where to look.
  const t=setTimeout(()=>onWait&&onWait("Waiting for your wallet… Open MetaMask (click the fox icon at the top of your browser) and approve the request."),6000);
  try{return await promise;}finally{clearTimeout(t);}
}
function walletError(e){
  const code=e?.code??e?.data?.originalError?.code;
  if(code===4001||e?.code==="ACTION_REJECTED") return "You cancelled in your wallet. Nothing happened.";
  if(code===-32002) return "Your wallet already has a request waiting. Open MetaMask (the fox icon at the top of your browser), finish or cancel it, then try again.";
  return e?.message||"Couldn't connect your wallet.";
}
async function connect(onWait){
  if(account) return account;
  const problem=walletProblem();
  if(problem){toast(problem);throw new Error(problem);}
  onWait&&onWait("Connecting your wallet… approve it in MetaMask.");
  try{
    const [a]=await withWalletWait(window.ethereum.request({method:"eth_requestAccounts"}),onWait);
    if(!a) throw new Error("Your wallet didn't share an account. Unlock MetaMask and try again.");
    const hex="0x"+CONFIG.CHAIN_ID.toString(16);
    onWait&&onWait("Switching your wallet to Robinhood Chain… approve it in MetaMask.");
    try{await withWalletWait(window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:hex}]}),onWait);}
    catch(e){
      const code=e?.code??e?.data?.originalError?.code;
      if(code===4902||/unrecognized|not been added|unknown chain/i.test(e?.message||"")){
        onWait&&onWait("Adding Robinhood Chain to your wallet… approve it in MetaMask.");
        await withWalletWait(window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:hex,chainName:"Robinhood Chain",nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},rpcUrls:[CONFIG.RPC_URL],blockExplorerUrls:[CONFIG.EXPLORER]}]}),onWait);
      } else throw e;
    }
    account=a;toast("Wallet connected");document.dispatchEvent(new Event("wallet"));
    return account;
  }catch(e){const m=walletError(e);toast(m);throw new Error(m);}
}
// Top-bar button: report problems instead of failing silently.

/* deterministic pixel avatar, generated from the handle */
function pixAvatar(seed){
  let h=2166136261;for(const c of String(seed)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}
  const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296;};
  const bgs=["#12352a","#1d2b24","#2b2f2d","#0f3d2e","#233a33","#2c2a24"],fgs=["#3fe39a","#b9f5d5","#e9ece9","#7fd8b0","#dff7ea"];
  const bg=bgs[Math.floor(rnd()*bgs.length)],fg=fgs[Math.floor(rnd()*fgs.length)],fg2=fgs[Math.floor(rnd()*fgs.length)];
  let r=`<rect width="10" height="10" fill="${bg}"/>`;
  for(let y=1;y<9;y++)for(let x=1;x<5;x++){const v=rnd();if(v<.5){const c=v<.12?fg2:fg;r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/><rect x="${9-x}" y="${y}" width="1" height="1" fill="${c}"/>`;}}
  return `<svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

function drawCarousel(list){
  const body=$("#carBody"),segs=$("#segs"); if(!body) return;
  if(!list.length){body.className="car-empty";body.innerHTML="No shillers yet. Profiles appear once the tracker scores its first posts.";$("#autotag").textContent="Waiting";return;}
  const SLIDE=5000; let i=0,t0=performance.now(),paused=reduced(),raf;
  if(paused) $("#autotag").textContent="Paused";
  segs.innerHTML=list.map((_,k)=>`<button aria-label="Show shiller ${k+1}"><i></i></button>`).join("");
  const draw=()=>{const s=list[i];body.className="car";
    body.innerHTML=`<div class="who"><div class="feat"><span class="tag">Featured shiller</span>${i+1} / ${list.length}</div><span class="h">@${esc(s.handle)}</span><h4>${esc(s.handle)}</h4><p>Ranked #${i+1} across every launch, with ${num(s.posts)} tracked posts this cycle.</p>
      <div class="kv"><div><span>Points</span><b>${num(s.points)}</b></div><div><span>Interactions</span><b>${num(inter(s))}</b></div><div><span>Earned</span><b class="up">+${usd(s.earned)}</b></div></div>
      <a class="btn sm dark" href="https://x.com/${esc(s.handle)}" target="_blank" rel="noopener">View on X ↗</a></div>
      <div class="frame">${pixAvatar(s.handle)}<span class="xb">𝕏</span></div>`;
    segs.querySelectorAll("button").forEach((b,k)=>{b.setAttribute("aria-current",k===i);b.classList.toggle("done",k<i);b.querySelector("i").style.width="0";});
    t0=performance.now();};
  const go=d=>{i=(i+d+list.length)%list.length;draw();};
  $("#cprev").onclick=()=>go(-1);$("#cnext").onclick=()=>go(1);
  segs.onclick=e=>{const b=e.target.closest("button");if(!b)return;i=[...segs.children].indexOf(b);draw();};
  const pnl=body.closest(".pnl");pnl.onmouseenter=()=>{if(!reduced()){paused=true;$("#autotag").textContent="Paused";}};pnl.onmouseleave=()=>{if(!reduced()){paused=false;t0=performance.now();$("#autotag").textContent="Auto-playing";}};
  const tick=now=>{if(!document.body.contains(body))return;
    if(!paused){const p=(now-t0)/SLIDE;const cur=segs.children[i]?.querySelector("i");if(cur)cur.style.width=Math.min(100,p*100)+"%";if(p>=1)go(1);}
    raf=requestAnimationFrame(tick);};
  draw();raf=requestAnimationFrame(tick);
}

/* ---------- launch wallets (derived in the browser, only the connected wallet can open them) ---------- */
// How it works: the connected wallet signs one fixed message. That signature is turned into a private
// "seed", and each launch wallet's key is derived from the seed and a number (0, 1, 2 ...). The keys never
// leave the browser and are never stored anywhere. Signing the same message with the same wallet always
// recreates the same launch wallets, so only the person who controls the connected wallet can open them.

const seedMessage=a=>`$SHILL launch wallets\n\nSigning this opens your $SHILL launch wallets. The signature is the key to them, so only sign it on the official $SHILL site.\n\nThis does not cost gas or give anyone access to your wallet.\n\nWallet: ${a.toLowerCase()}`;

/** One signature per session. Checks the wallet signs deterministically, or the launch wallets couldn't be reopened later. */
async function openSeed(){
  const a=await connect(); if(!a) throw new Error("Connect your wallet first.");
  if(!window.ethers) throw new Error("The wallet library didn't load. Refresh the page (Ctrl+Shift+R or Cmd+Shift+R), and turn off ad blockers for this site if it keeps happening.");
  if(lw.seed&&lw.owner===a.toLowerCase()) return lw.seed;
  if(!window.ethers) throw new Error("Wallet library didn't load. Refresh the page.");
  const signer=new ethers.providers.Web3Provider(window.ethereum).getSigner();
  const msg=seedMessage(a);
  const s1=await signer.signMessage(msg);
  if(!localStorage.getItem("shill_sig_ok:"+a.toLowerCase())){
    toast("Sign once more to confirm your wallet can reopen launch wallets later.");
    const s2=await signer.signMessage(msg);
    if(s1!==s2) throw new Error("Your wallet produces a different signature each time, so it can't be used to open launch wallets. Try MetaMask or Rabby.");
    try{localStorage.setItem("shill_sig_ok:"+a.toLowerCase(),"1");}catch{}
  }
  lw.seed=ethers.utils.keccak256(s1); lw.owner=a.toLowerCase();
  return lw.seed;
}
function launchWallet(n,provider){
  const key=ethers.utils.solidityKeccak256(["bytes32","uint256"],[lw.seed,n]);
  return new ethers.Wallet(key,provider);
}
/** First launch wallet that hasn't launched anything yet (reuses a funded-but-unused one). */
async function nextLaunchWallet(provider){
  for(let n=0;n<200;n++){
    const w=launchWallet(n,provider);
    if((await provider.getTransactionCount(w.address))===0) return {n,w};
  }
  throw new Error("Too many launch wallets. Contact support.");
}

// Last technical details, so a failed launch can be reported precisely.
let lastLaunchDetails="";
function findRevertData(e,depth=0){
  if(!e||depth>6) return "";
  for(const k of ["data","error","body","info"]){
    const v=e[k];
    if(typeof v==="string"&&/^0x[0-9a-f]{8,}$/i.test(v)) return v;
    if(typeof v==="string"&&k==="body"){try{const j=JSON.parse(v);const d=j?.error?.data;if(typeof d==="string"&&d.startsWith("0x"))return d;}catch{}}
    if(v&&typeof v==="object"){const d=findRevertData(v,depth+1);if(d)return d;}
  }
  return "";
}
function explainRevert(e){
  const raw=findRevertData(e);
  const msgs=[e?.reason,e?.error?.message,e?.error?.error?.message,e?.message].filter(Boolean);
  lastLaunchDetails=`code: ${e?.code??"?"} | data: ${raw||"none"} | message: ${(msgs[msgs.length-1]||"").slice(0,300)} | inner: ${(e?.error?.message||e?.error?.error?.message||"").slice(0,200)}`;
  try{console.error("[launch] Pons error",e);}catch{}
  let data=raw||e?.data?.data||e?.data||e?.error?.data?.data||e?.error?.data||"";
  if(typeof data!=="string"){try{data=JSON.stringify(data);}catch{data="";}}
  if(!/^0x[0-9a-f]*$/i.test(data)){
    const body=e?.error?.body||e?.body; try{const j=JSON.parse(body);data=j?.error?.data||"";}catch{}
  }
  if(typeof data==="string"&&data.startsWith("0x08c379a0")){
    try{return "Pons refused the launch: "+ethers.utils.defaultAbiCoder.decode(["string"],"0x"+data.slice(10))[0]+".";}catch{}
  }
  if(typeof data==="string"&&data.length>=10){
    const sel=data.slice(0,10).toLowerCase();
    for(const [sig,text] of Object.entries(PONS_ERRORS)) if(ethers.utils.id(sig).slice(0,10)===sel) return text;
    return `Pons refused the launch (error code ${sel}). Send this code to the $SHILL team.`;
  }
  const m=(e?.reason||e?.error?.message||e?.message||"").replace(/\(.*$/s,"").trim();
  return m?`Pons refused the launch: ${m}.`:"Pons refused the launch.";
}
/** Simulates the launch as if the launch wallet were already funded. Returns {ok, reason}. */
async function rehearseLaunch(provider,tx){
  const call={from:tx.from,to:tx.to,data:tx.data,value:ethers.utils.hexValue(tx.value)};
  const bigBalance="0x56BC75E2D63100000"; // pretend 100 ETH, only inside this simulation
  try{ await provider.send("eth_call",[call,"latest",{[tx.from]:{balance:bigBalance}}]); return {ok:true}; }
  catch(e){
    const msg=String(e?.message||"")+String(e?.error?.message||"");
    // If the network doesn't support the pretend balance, fall back to a gas estimate check from the real wallet.
    if(/override|invalid argument|too many arguments|unsupported/i.test(msg)&&!/revert/i.test(msg)){
      // No pretend balances on this network: if the launch wallet already holds enough, rehearse for real.
      try{
        const bal=await provider.getBalance(tx.from);
        if(bal.gte(tx.value)){ await provider.send("eth_call",[call,"latest"]); return {ok:true}; }
      }catch(e2){ return {ok:false,reason:explainRevert(e2)}; }
      return {ok:true,skipped:true};
    }
    return {ok:false,reason:explainRevert(e)};
  }
}

  const drawWallet=()=>{
    $("#wnote").textContent=account?`Connected: ${short(account)}. You'll sign a free message, then approve one payment. Everything else happens automatically.`:"Connect the wallet you'll pay from. Only this wallet can ever open the launch wallet it creates.";

  (async()=>{try{if(CONFIG.API_BASE&&window.ethers){await launchConfig();const f=new ethers.Contract(lw.cfg.factory,PONS_ABI.factory,chainProvider());launchFeeWei=await f.launchFee();drawSum();}}catch{}})();

  $("#go").onclick=async()=>{

    try{
      if(!CONFIG.API_BASE){
        if(!CONFIG.DEMO) throw new Error("The launch service isn't connected yet.");
        for(const [k,t] of [["wallet","Opening your launch wallet…"],["fund","Funding it…"],["deploy","Launching on Pons…"]]){setStep(k);msg(t);await new Promise(r=>setTimeout(r,900));}
        setStep("live",true);msg("Preview only. Nothing was launched.","ok");btn.disabled=false;return;
      }
      await launchConfig();
      const provider=chainProvider();
      const factory=new ethers.Contract(lw.cfg.factory,PONS_ABI.factory,provider);

      // 1. open the launch wallet
      setStep("wallet");msg("Sign the message in your wallet. It's free and doesn't cost gas.");
      await withWalletWait(openSeed(),t=>msg(t));
      const {w}=await nextLaunchWallet(provider);

      // checks before any money moves
      msg("Checking Pons…");
      let allowed=true;try{allowed=await factory.canLaunch(w.address);}catch{/* not all deployments expose canLaunch; the rehearsal below decides */}
      if(!allowed) throw new Error("Pons is only letting approved wallets launch right now, so this launch can't go through yet. Nothing was charged.");
      let maxTax=null;try{maxTax=await factory.maxCreatorTaxBps();}catch{}
      if(maxTax&&ethers.BigNumber.from(v.creatorFee*100).gt(maxTax)) throw new Error(`Pons caps the creator fee at ${maxTax.toNumber()/100}%. Pick a lower fee.`);
      let cfgId=null;const count=(await factory.launchConfigCount()).toNumber();
      for(let i=0;i<count;i++){if((await factory.getLaunchConfig(i)).enabled){cfgId=i;break;}}
      if(cfgId===null) throw new Error("Pons isn't accepting new launches right now. Nothing was charged.");
      launchFeeWei=await factory.launchFee();
      const buyWei=ethers.utils.parseEther(String(v.initialBuy||0));

      // build the exact launch now, so it can be rehearsed before any payment
      msg("Uploading your image…");
      const {url:logo}=await api.post("/media",{image:img});
      const expected=await factory.previewLaunchEconomics(cfgId,ZERO);
      const params={name:v.name,symbol:v.ticker,logo,description:v.description,
        socials:{twitter:v.links.x||"",telegram:v.links.telegram||"",discord:"",website:v.links.website||"",farcaster:""},

        expectedEconomics:expected,salt:ethers.utils.hexlify(ethers.utils.randomBytes(32))};
      const useRouter=buyWei.gt(0);
      const iface=new ethers.utils.Interface([...PONS_ABI.factory,...PONS_ABI.router]);
      const launchTx={
        from:w.address,
        to:useRouter?lw.cfg.router:lw.cfg.factory,
        data:useRouter?iface.encodeFunctionData("launchAndBuy",[params,cfgId,ZERO,buyWei,0,w.address,[]]):iface.encodeFunctionData("launchToken",[params,cfgId,ZERO]),
        value:launchFeeWei.add(buyWei)
      };
      if(useRouter&&(await provider.getCode(lw.cfg.router))==="0x")
        throw new Error("Pons's launch-and-buy contract wasn't found at the configured address. Try again with no initial buy, and tell the $SHILL team. Nothing was charged.");

      // rehearse the exact launch (pretending the launch wallet is already funded) before asking for any money
      msg("Checking Pons will accept this launch…");
      const rehearsal=await rehearseLaunch(provider,launchTx);
      if(!rehearsal.ok) throw new Error(rehearsal.reason+" Nothing was charged.");

      // work out the real gas needed. If the estimate fails but the test run above passed, Pons accepts the
      // launch and the estimate is the only problem, so use a safe manual gas limit instead.
      msg("Working out the gas needed…");
      const gasPrice=(await provider.getGasPrice()).mul(12).div(10); // 20% headroom for price moves
      const callObj={from:launchTx.from,to:launchTx.to,data:launchTx.data,value:ethers.utils.hexValue(launchTx.value)};
      let gasLimit=null;
      try{ gasLimit=ethers.BigNumber.from(await provider.send("eth_estimateGas",[callObj,"latest",{[w.address]:{balance:"0x56BC75E2D63100000"}}])).mul(13).div(10); }catch{}
      if(!gasLimit){ try{ gasLimit=(await provider.estimateGas({from:launchTx.from,to:launchTx.to,data:launchTx.data,value:launchTx.value})).mul(13).div(10); }catch{} }
      if(!gasLimit) gasLimit=ethers.BigNumber.from(MANUAL_LAUNCH_GAS);
      const gasCost=gasLimit.mul(gasPrice);
      const need=launchFeeWei.add(buyWei).add(gasCost);

      // 2. fund it (only what's missing; a previous attempt's ETH is reused)
      setStep("fund");
      const have=await provider.getBalance(w.address);
      if(have.lt(need)){
        const top=need.sub(have);
        msg(`Approve the payment in your wallet: ${(+ethers.utils.formatEther(top)).toFixed(5)} ETH. This covers Pons's fee${buyWei.gt(0)?", your initial buy":""} and gas. Unused gas comes back to you automatically.`);
        const signer=new ethers.providers.Web3Provider(window.ethereum).getSigner();
        const ftx=await withWalletWait(signer.sendTransaction({to:w.address,value:top}),t=>msg(t));
        msg("Waiting for your payment to confirm…");
        await provider.waitForTransaction(ftx.hash,1,180000);
      }

      // 3. launch on Pons from the launch wallet, with an explicit gas limit and price
      setStep("deploy");msg("Launching on Pons…");
      let tx;
      try{
        tx=await w.sendTransaction({to:launchTx.to,data:launchTx.data,value:launchTx.value,gasLimit,gasPrice});
      }catch(e){
        if(e?.code==="ACTION_REJECTED"||e?.code===4001) throw e;
        let reason=explainRevert(e);
        if(/insufficient funds/i.test(String(e?.message)+String(e?.error?.message))) reason="The launch wallet doesn't have enough ETH for gas right now. Click Launch on Pons again to top it up.";
        throw new Error(reason+" Your ETH is safe in your launch wallet: click Launch on Pons to retry, or send it back from My launch wallets.");
      }
      msg("Waiting for Robinhood Chain to confirm…");
      const rc=await tx.wait();
      if(rc.status!==1){
        let reason="The launch transaction failed on chain.";
        try{ await provider.send("eth_call",[callObj,"latest"]); }catch(e2){ reason=explainRevert(e2); }
        throw new Error(reason+" Your remaining ETH is still in your launch wallet: send it back from My launch wallets.");
      }

      // return unused gas money to the connected wallet (initial-buy tokens stay in the launch wallet)
      try{
        const left=await provider.getBalance(w.address);
        const sendCost=gasPrice.mul(21000).mul(2);
        if(left.gt(sendCost.mul(3))){ await (await w.sendTransaction({to:account,value:left.sub(sendCost),gasLimit:21000,gasPrice})).wait(); }
      }catch{/* not critical: any leftover can be sent back from My launch wallets */}

      // 4. list it on $SHILL
      const res=await api.post("/launch/register",{txHash:tx.hash,owner:account,description:v.description,links:v.links,topN:v.topN,schedule:v.schedule,logoUrl:logo});
      setStep("live",true);msg("Launched on Pons. Opening your token page…","ok");
      setTimeout(()=>location.hash="#/token/"+res.id,1200);
    }catch(e){
      msg((e&&(e.reason||e.data?.message||e.message))||"Something went wrong.","err");
      if(e?.code==="ACTION_REJECTED"||e?.code===4001) msg("You cancelled in your wallet. Nothing else happened.","err");
      else if(lastLaunchDetails){
        const box=$("#gmsg");
        box.insertAdjacentHTML("beforeend",`<div style="margin-top:10px;font-size:12px;color:var(--faint)">Technical details (send these to the $SHILL team):<div class="addr" style="margin-top:6px;font-size:11px;user-select:all">${esc(lastLaunchDetails)}</div><button class="btn sm" id="cpDetails" style="margin-top:6px">Copy details</button></div>`);
        $("#cpDetails").onclick=()=>copy(lastLaunchDetails);
      }
      btn.disabled=false;
    }
  };
}

  app.innerHTML=`<div class="wrap"><div class="page-h"><span class="eyebrow">Launch wallets</span><h1>My launch wallets</h1>

  $("#open").onclick=async()=>{
    const box=$("#wl");
    const say=(t,cls="m")=>{let el=$("#wlmsg");if(!el){box.insertAdjacentHTML("beforeend",'<p id="wlmsg" style="margin-top:12px;font-size:14px"></p>');el=$("#wlmsg");}el.className=cls;el.textContent=t;};
    say("Starting…");
    try{
      if(!window.ethers&&CONFIG.API_BASE) throw new Error("The wallet library didn't load. Refresh the page (Ctrl+Shift+R or Cmd+Shift+R), and turn off ad blockers for this site if it keeps happening.");
      if(CONFIG.API_BASE&&!account){ await connect(t=>say(t)); }
      if(CONFIG.API_BASE) say("Sign the message in your wallet. It's free and doesn't cost gas.");
      if(!CONFIG.API_BASE) throw new Error(CONFIG.DEMO?"Preview only: your launch wallets appear here on the live site.":"The launch service isn't connected yet.");
      await launchConfig();const provider=chainProvider();await withWalletWait(openSeed(),t=>say(t));
      box.innerHTML=`<p class="m">Looking for your launch wallets…</p>`;
      const rows=[];let empty=0;
      for(let n=0;n<200&&empty<3;n++){
        const w=launchWallet(n,provider);
        const [nonce,bal]=await Promise.all([provider.getTransactionCount(w.address),provider.getBalance(w.address)]);
        if(nonce===0&&bal.isZero()){empty++;continue;}
        empty=0;rows.push({n,w,nonce,bal});
      }
      if(!rows.length){box.innerHTML=`<p class="m">No launch wallets yet. They appear here after your first launch.</p>`;return;}
      box.innerHTML=`<ul class="list">${rows.map(r=>`<li style="flex-wrap:wrap"><span><b>Launch wallet ${r.n+1}</b><br><code style="font-family:var(--mono);font-size:13px">${r.w.address}</code><br><span class="m">${(+ethers.utils.formatEther(r.bal)).toFixed(5)} ETH · ${r.nonce?"used for a launch":"funded, not launched yet"}</span></span>
        <span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="btn sm" target="_blank" rel="noopener" href="${esc(lw.cfg.explorer)}/address/${r.w.address}">Explorer</a><button class="btn sm" data-key="${r.n}">Show private key</button><button class="btn sm" data-back="${r.n}" ${r.bal.isZero()?"disabled":""}>Send ETH to my wallet</button></span></li>`).join("")}</ul>`;
      box.onclick=async e=>{
        const k=e.target.dataset.key,b=e.target.dataset.back;
        if(k!==undefined){
          if(!confirm("Anyone who sees this key controls this launch wallet. Only reveal it to import into your own wallet app. Continue?")) return;
          const w=launchWallet(+k,provider);e.target.outerHTML=`<code class="addr key show" style="max-width:100%">${w.privateKey}</code>`;
        }
        if(b!==undefined){
          e.target.disabled=true;
          try{
            const w=launchWallet(+b,provider);const bal=await provider.getBalance(w.address);const gp=await provider.getGasPrice();
            const value=bal.sub(gp.mul(21000).mul(2));if(value.lte(0)) throw new Error("Not enough ETH to cover gas.");
            const tx=await w.sendTransaction({to:account,value});await tx.wait();toast("Sent to your wallet");$("#open").click?.();
          }catch(err){toast(err.message||"Couldn't send.");e.target.disabled=false;}
        }
      };
    }catch(e){say(walletError(e),"err");}
  };
}

        <tr><td>Your share</td><td class="num">2,500 ÷ 50,000 = 5%</td></tr>
        <tr><td>Your payout</td><td class="num">5% × $${pool.toLocaleString()} = $${(pool*0.05).toFixed(2)}</td></tr>
      </tbody></table></div>
      <p>Finished 26th? Nothing this cycle, but points reset and you start fresh in the next one.</p>
    </section>

    <section class="dx-sec" id="xmoney">
      <h2>X Money</h2>
      <p>Payouts are sent through <strong>X Money</strong> straight to your X account. There's nothing to claim and no wallet to connect.</p>
      <ul><li>Each payout shows the token and cycle it came from.</li><li>Every payout is also listed publicly on the <a href="#/payouts">Payouts</a> page.</li><li>If your X account can't receive X Money yet, your share is held for 30 days while you set it up. After that, it rolls into the token's next pool.</li><li>Very small shares under $0.10 roll into your next payout instead of being sent on their own.</li></ul>
    </section>

    <section class="dx-sec" id="fairness">
      <h2>Anti-bot system</h2>
      <p>Rewards only mean something if bots can't farm them. Every shiller's trust score is recalculated every 15 minutes from their recent posts, accounts and engagement.</p>
      <p>You start at <strong>1.0</strong>. Each signal below takes points off. What's left is your trust score, and it multiplies all your posts.</p>
      <div class="dtw"><table class="dt"><thead><tr><th>Signal</th><th>Trust lost</th></tr></thead><tbody>
        ${TRUST_SIGNALS.map(([t,v])=>`<tr><td>${t}</td><td class="num neg">−${v.toFixed(2)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="co"><span class="ic">i</span><p>Signals clear on their own. Stop the behavior and your trust score recovers at the next check. Nothing is permanent unless you're banned.</p></div>
    </section>

    <section class="dx-sec" id="levels">
      <h2>Trust levels</h2>
      <p>Your trust score puts you in one of four levels, shown next to your name on every leaderboard.</p>
      <div class="dtw"><table class="dt"><thead><tr><th>Level</th><th>Trust score</th><th>What happens</th></tr></thead><tbody>
        <tr><td>Clear</td><td class="num">1.0</td><td>Full points. This is almost everyone.</td></tr>
        <tr><td>Watch</td><td class="num">0.75 to 0.99</td><td>Points reduced. Usually one signal, like a new account.</td></tr>
        <tr><td>Limited</td><td class="num">0.50 to 0.74</td><td>Points roughly halved. Several signals at once.</td></tr>
        <tr><td>Blocked</td><td class="num">Below 0.50</td><td>Treated as 0. No points and no payout this cycle.</td></tr>
      </tbody></table></div>
      <p>An established account, at least 60 days old with 100+ followers, can't drop below Watch from posting speed or wording alone. It takes an engagement or account signal.</p>
    </section>

    <section class="dx-sec" id="disqualified">
      <h2>Disqualification</h2>
      <div class="co warn"><span class="ic">!</span><p>These go beyond a low trust score. They remove your profile from every $SHILL leaderboard, and banned profiles are never paid.</p></div>
      <ul><li>Buying likes, views, followers or comments, or using automation to post or engage.</li><li>Running several $SHILL profiles, or linking accounts you don't own.</li><li>Spam: mass-tagging, flooding comment sections or posting the same thing over and over.</li><li>Misleading content, like fake partnerships or guaranteed price claims.</li><li>Harassment or hateful content.</li></ul>
    </section>

    <section class="dx-sec" id="appeals">
      <h2>Appeals</h2>
      <p>Think you were flagged by mistake? Message <strong>$SHILL on X</strong> with your handle and the post link within 7 days. A person reviews every appeal. If it was a mistake, your points are restored and any missed payout is added to your next one.</p>
    </section>

    <section class="dx-sec" id="fees">
      <h2>Buyback and burn</h2>
      <p>$SHILL keeps <strong>${F()}%</strong> of every launch's creator fees. All of it is used to buy $SHILL on the open market and burn it, removing it from supply forever.</p>
      <ul><li>It runs automatically on a fixed schedule, with no pauses and no one deciding when.</li><li>Every buy and burn is listed publicly with its transaction, so anyone can check it on chain.</li><li>The running total burned is shown on the homepage.</li></ul>
      <p>There are no other platform fees. Launchers pay Pons's launch fee and a little gas, plus any initial buy. Shillers pay nothing.</p>
    </section>

    <section class="dx-sec" id="faq">
      <h2>FAQ</h2>
      ${[
        ["Do I need to hold the token to earn?","No. Anyone with a linked X account can shill any token and earn."],
        ["Do I need to connect a wallet?","Shillers don't: they're paid through X Money. Launchers connect the wallet they pay from."],
        ["Who controls the launch wallet?","You do. It's opened by your connected wallet's signature, and the key never leaves your browser. The creator fees still go to the $SHILL fee wallet, which your launch wallet can't change."],
        ["Is this a real Pons token?","Yes. It's deployed through Pons V2 on Robinhood Chain with the standard bonding curve, and graduates to a locked Uniswap v4 pool."],
        ["Which platform earns the most?","None. Points work the same everywhere. Video gets a bigger content bonus because it takes more effort."],
        ["How is my cut decided?","By points. Your share is your points divided by the total points of everyone in the paid spots."],
        ["How often are payouts?","Whatever the launcher chose: every 1, 4, 12 or 24 hours, or every 7 days, on a fixed clock from launch."],
        ["Why didn't my post count?","Check that it names the ticker or contract address, has at least 5 real words, is public, came from a linked account and was posted after launch."],
        ["What does Watch or Limited next to my name mean?","The anti-bot system found something that lowers your trust score. It clears on its own when the behavior stops."],
        ["What if nobody trades the token?","Payouts come from creator fees. No trades means no fees and no payout that cycle."],
        ["Can the launcher change the settings later?","No. Pair, creator fee, paid spots and cycle are locked at launch, and the fees stay locked to the launch wallet."],
        ["Is $SHILL affiliated with X, Pons or Robinhood?","No. $SHILL is independent."]
      ].map(([q,a])=>`<details class="fq"><summary>${q}</summary><p>${a}</p></details>`).join("")}
    </section>

    <section class="dx-sec" id="risks">
      <h2>Risks</h2>
      <p>Tokens launched through $SHILL are speculative and can lose all their value. Payouts depend on the creator fees a token actually earns, which can be zero. Nothing on this site is financial advice. $SHILL is not affiliated with Pons, X Corp., TikTok, Meta, Google, Reddit, pump.fun, FOMO or Robinhood Markets, Inc.</p>
      <p class="updated">Scoring values may be tuned to keep leaderboards fair. Changes are posted here before they take effect.</p>
    </section>

    <div class="pn" id="pn"></div>
  </article></div></div>`;
  docsMounted=true;

  // calculator
  const v=id=>$("#"+id).disabled?0:Math.max(0,+$("#"+id).value||0);
  const ids=[["cLike","lLike","nL"],["cCom","lCom","nC"],["cSh","lSh","nS"],["cSv","lSv","nV"],["cView","lView","nW"]];
  const relabel=()=>{const f=CALC_FIELDS[$("#cPlat").value];
    ids.forEach(([inp,lab,out],k)=>{const name=f[k],base=["Likes","Comments","Shares","Saves","Views"][k];$("#"+inp).disabled=!name;$("#"+lab).textContent=name||base+" (not shown)";
      $("#"+out).textContent=name?(k===4?name+" (per 1,000)":name):base+" (not shown)";$("#"+out).parentElement.style.opacity=name?1:.45;});};
  $("#cPlat").addEventListener("change",()=>{relabel();calc();});relabel();
  const calc=()=>{
    const L=v("cLike")*S.like,C=v("cCom")*S.comment,Sh=v("cSh")*S.share,Sv=v("cSv")*S.save,W=Math.floor(v("cView")/1000)*S.perThousandViews;
    const bonus=c[$("#cType").value][1],tr=+$("#cTrust").value;
    const raw=(L+C+Sh+Sv+W)*bonus*tr,pts=Math.min(S.postCap,Math.round(raw));
    $("#oL").textContent=num(L);$("#oC").textContent=num(C);$("#oS").textContent=num(Sh);$("#oV").textContent=num(Sv);$("#oW").textContent=num(W);
    $("#oB").textContent="× "+bonus;$("#oT").textContent="× "+tr;$("#oP").textContent=pts.toLocaleString()+(raw>S.postCap?" (capped)":"");
    $("#oPay").innerHTML=`If the paid spots earned <b>50,000 points</b> in total and the pool was <b>$${pool.toLocaleString()}</b>, this post alone would pay about <b class="up">$${(pts/50000*pool).toFixed(2)}</b>.`;
  };
  app.querySelectorAll(".calc input,.calc select").forEach(e=>e.addEventListener("input",calc));calc();

  // active section + prev/next
  const links=[...app.querySelectorAll(".dx-nav a")];
  const setOn=id=>{links.forEach(a=>a.classList.toggle("on",a.dataset.id===id));
    const k=flat.findIndex(f=>f[0]===id),pv=flat[k-1],nx=flat[k+1];
    $("#pn").innerHTML=`${pv?`<a href="#/docs/${pv[0]}">← ${pv[1]}</a>`:"<span></span>"}${nx?`<a href="#/docs/${nx[0]}">${nx[1]} →</a>`:""}`;
    const on=links.find(a=>a.dataset.id===id);if(on&&innerWidth<=860)on.scrollIntoView({block:"nearest",inline:"center"});};
  const io=new IntersectionObserver(es=>{es.filter(e=>e.isIntersecting).forEach(e=>setOn(e.target.id));},{rootMargin:"-20% 0px -70% 0px"});
  app.querySelectorAll(".dx-sec").forEach(s=>io.observe(s));
  setOn(anchor||"overview");
  if(anchor) setTimeout(()=>document.getElementById(anchor)?.scrollIntoView(),0);
}

/* ---------- router ---------- */
function closeNav(){$("#sidenav").classList.remove("open");$("#scrim").classList.remove("on");$("#burger").setAttribute("aria-expanded","false");}
function route(){
  const h=location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="docs" && docsMounted && document.getElementById("docsRoot")){
    const el=h[1]&&document.getElementById(h[1]); el?el.scrollIntoView({behavior:reduced()?"auto":"smooth"}):window.scrollTo(0,0); closeNav(); return;
  }
  docsMounted=false;
  clearHome();
  document.querySelectorAll(".navlist a").forEach(a=>{const key=a.getAttribute("href").replace(/^#\/?/,"");const on=key===h[0]||(key==="tokens"&&h[0]==="token");on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current");});
  closeNav();app.onclick=null;app.onchange=null;window.scrollTo(0,0);
  if(h[0]==="tokens") viewTokens();
  else if(h[0]==="leaderboard") viewLeaderboard();
  else if(h[0]==="payouts") viewPayouts();
  else if(h[0]==="token") viewToken(h[1]);
  else if(h[0]==="launch") viewLaunch();
  else if(h[0]==="wallets") viewWallets();
  else if(h[0]==="docs") viewDocs(h[1]);
  else viewHome();
}

/* ---------- boot ---------- */
(function boot(){
  document.querySelectorAll("#brand,.brandName").forEach(e=>e.textContent=CONFIG.BRAND);
  $("#strip").innerHTML = (CONFIG.CONTRACT
    ? `CA: <code>${esc(CONFIG.CONTRACT)}</code><button id="cpCa">Copy</button><a href="${esc(CONFIG.EXPLORER)}/token/${esc(CONFIG.CONTRACT)}" target="_blank" rel="noopener">View on explorer</a>`
    : `<span>$${esc(CONFIG.TICKER)} contract address goes live at launch.</span>`)
    + (CONFIG.DEMO?`<span class="sample">Showing sample data</span>`:"");
  $("#cpCa")&&($("#cpCa").onclick=()=>copy(CONFIG.CONTRACT));
  const setHref=(sel,url)=>document.querySelectorAll(sel).forEach(a=>{if(url)a.href=url;else a.remove();});
  setHref(".xA",CONFIG.X_URL);setHref(".ponsA",CONFIG.PONS_URL);
  $("#connectBtn").onclick=connectFromBar;
  document.addEventListener("wallet",()=>{$("#connectLabel").textContent=short(account);});
  $("#burger").onclick=()=>{const o=$("#sidenav").classList.toggle("open");$("#scrim").classList.toggle("on",o);$("#burger").setAttribute("aria-expanded",o);};
  $("#scrim").onclick=closeNav;
  addEventListener("keydown",e=>{if(e.key==="Escape")closeNav();});
  $("#gsearch").onkeydown=e=>{if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;pendingQ=v.replace(/^\$/,"");e.target.value="";
    const target=v.startsWith("@")?"#/leaderboard":"#/tokens";if(location.hash===target)route();else location.hash=target;};
  addEventListener("hashchange",route);route();
})();
</script>
